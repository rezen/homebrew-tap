name: Homebrew
on: [push, pull_request]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      formulae: ${{ steps.list.outputs.formulae }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          formulae=$(find Formula -name '*.rb' -exec basename {} .rb \; | sort | jq --raw-input . | jq --slurp --compact-output .)
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"

  formula:
    needs: discover
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJson(needs.discover.outputs.formulae) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - run: brew style Formula/${{ matrix.formula }}.rb
      - run: brew tap rezen/tap "$GITHUB_WORKSPACE"
      - run: brew audit --strict --formula rezen/tap/${{ matrix.formula }}
      - run: brew install --build-from-source rezen/tap/${{ matrix.formula }}
      - run: brew test rezen/tap/${{ matrix.formula }}
